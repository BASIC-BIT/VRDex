name: Staging Deploy

on:
  workflow_run:
    workflows:
      - Baseline Checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
        default: false

permissions:
  contents: read

concurrency:
  group: staging-deploy-main
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check staging deploy configuration
        id: gate
        env:
          CONVEX_DEPLOY_KEY_DEV: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HOSTED_BASE_URL: ${{ vars.VRDEX_HOSTED_E2E_BASE_URL }}
          HOSTED_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.VRDEX_STAGING_CLERK_JWT_ISSUER_DOMAIN }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "$CONVEX_DEPLOY_KEY_DEV" ]; then missing+=("CONVEX_DEPLOY_KEY_DEV"); fi
          if [ -z "$VERCEL_TOKEN" ]; then missing+=("VERCEL_TOKEN"); fi
          if [ -z "$VERCEL_ORG_ID" ]; then missing+=("VERCEL_ORG_ID"); fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then missing+=("VERCEL_PROJECT_ID"); fi
          if [ -z "$HOSTED_BASE_URL" ]; then missing+=("VRDEX_HOSTED_E2E_BASE_URL"); fi
          if [ -z "$HOSTED_BROWSER_TOKEN" ]; then missing+=("VRDEX_HOSTED_E2E_BROWSER_TOKEN"); fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Staging deploy"
              echo "Skipped because required staging deployment settings are missing:"
              printf -- '- %s\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Fails the job rather than joining `missing` above, and the
          # difference matters. Everything in that list means "this repository
          # is not set up to deploy staging at all", which is a legitimate skip.
          # This one means staging *is* set up and is missing a setting its own
          # auth config requires — the exact state that froze staging on a
          # pre-Clerk build for three days. Skipping on it would report a green
          # workflow while staging silently stopped updating, which is a worse
          # version of the failure this check exists to remove.
          if [ -z "$CLERK_JWT_ISSUER_DOMAIN" ]; then
            echo "::error::VRDEX_STAGING_CLERK_JWT_ISSUER_DOMAIN is not set. convex/auth.config.ts reads CLERK_JWT_ISSUER_DOMAIN on every hosted deployment and the Convex CLI refuses to push without it, so staging cannot deploy. Set the repository variable to the Clerk Frontend API origin of the development instance backing staging."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "hosted_base_url=$HOSTED_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Audit Vercel staging runtime variable names
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOSTED_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          runtime_env_json="$RUNNER_TEMP/vrdex-vercel-staging-env.json"
          trap 'rm -f "$runtime_env_json"' EXIT

          pnpm dlx vercel@54.4.1 env ls staging --format=json --no-color --token "$VERCEL_TOKEN" > "$runtime_env_json"

          args=(--input "$runtime_env_json" --git-branch main)
          if [ "$HOSTED_DEVELOPER_CREDENTIALS" = "true" ]; then
            args+=(--require-developer-credentials)
          fi

          node scripts/check-staging-runtime-env.mjs "${args[@]}"

      # Two steps, because they answer different questions and only one of them
      # can ever be skipped.
      #
      # The format check is unconditional: `auth.config.ts` takes this value
      # verbatim, so a bare host or trailing slash matches no token issuer, and
      # no path that can write it may bypass that.
      - name: Validate the staging Clerk issuer format
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.VRDEX_STAGING_CLERK_JWT_ISSUER_DOMAIN }}
        run: |
          set -euo pipefail
          node scripts/check-clerk-issuer-match.mjs --issuer "$CLERK_JWT_ISSUER_DOMAIN" --validate-issuer-only

      # The comparison reads the key the *current* deployment serves. Reading
      # Vercel's pending configuration instead would have made a rotation an
      # ordinary run, and it does not work: `vercel env pull` does not write
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY back for this environment, even though
      # the audit above confirms it is set. Two staging deploys failed on that
      # before it was clear the premise was wrong.
      #
      # `--allow-missing-key` covers a target stuck on a build from before Clerk
      # existed, which serves no key to compare — the outage this workflow has to
      # remain able to fix. It forgives nothing else; an HTTP error throws.
      #
      # Always runs. There is no rotation escape: moving staging to another Clerk
      # instance is a documented manual sequence, not a workflow input. Three
      # rounds of review found a fresh hole in that input each time — it bypassed
      # format validation, then made the rollback unreachable, then would have
      # needed Vercel deployment rollback and repository-variable writes to be
      # correct. That is a two-provider migration system inside a deploy
      # workflow, for something done by hand once a year.
      - name: Verify the staging Clerk issuer before mutating Convex
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOSTED_BASE_URL: ${{ steps.gate.outputs.hosted_base_url }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.VRDEX_STAGING_CLERK_JWT_ISSUER_DOMAIN }}
        run: |
          set -euo pipefail
          node scripts/check-clerk-issuer-match.mjs             --base-url "$HOSTED_BASE_URL"             --issuer "$CLERK_JWT_ISSUER_DOMAIN"             --allow-missing-key

      # Must run before the deploy below, not with the other `convex env set`
      # calls after it. `convex/auth.config.ts` reads CLERK_JWT_ISSUER_DOMAIN at
      # push time, and the CLI refuses to push at all while it is unset — so a
      # variable set afterwards never gets the chance to be set.
      #
      # Provisioned here rather than by hand because a hand-set value is exactly
      # what failed: nobody set it when Clerk replaced Convex Auth in #224, every
      # staging deploy failed from that merge onward, and staging served a
      # pre-cutover build for three days while main moved on without it.
      #
      # The value is not a secret. A Clerk Frontend API origin is public — it is
      # encoded in the publishable key the browser already downloads — so it
      # lives in a repository variable where it can be read and audited.
      - name: Provision Convex auth configuration
        if: steps.gate.outputs.enabled == 'true'
        id: provision
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.VRDEX_STAGING_CLERK_JWT_ISSUER_DOMAIN }}
        run: |
          set -euo pipefail

          # Captured so a failed run can put it back. A retrieval failure is not
          # treated as "no previous value": that conflation meant a transient
          # error let the mutation proceed with nothing recorded, and a later
          # failure then found an empty previous issuer and declined to roll
          # back — leaving Convex on the new issuer with no way home. If the
          # current state cannot be read, this aborts before changing anything.
          #
          # Read through `env list` rather than `env get` so a genuinely unset
          # variable is distinguishable from a command that failed: the listing
          # succeeding is the signal that retrieval worked. The dump carries
          # every value on the deployment, so it is captured into a variable and
          # never echoed.
          if ! env_dump=$(pnpm exec convex env list 2>&1); then
            echo "::error::Could not read the current Convex environment, so the issuer this run would replace cannot be recorded. Refusing to change it without a rollback value."
            exit 1
          fi

          previous=$(printf '%s\n' "$env_dump" | tr -d '\r' | sed -n 's/^CLERK_JWT_ISSUER_DOMAIN=//p' | tail -n 1)

          # An unset variable is a legitimate empty — the original outage state,
          # where there is nothing to restore. A value that is not an origin is
          # also unrestorable, but for the opposite reason: putting it back would
          # restore something already broken. Both proceed; both say which.
          if [ -z "$previous" ]; then
            echo "No CLERK_JWT_ISSUER_DOMAIN is set on this deployment, so there is no previous value to roll back to."
          elif ! printf '%s' "$previous" | grep -qE '^https://[A-Za-z0-9.-]+$'; then
            echo "::warning::The current CLERK_JWT_ISSUER_DOMAIN is not an https origin, so it is not a value worth restoring. Rollback will be unavailable for this run."
            previous=""
          fi

          echo "previous_issuer=$previous" >> "$GITHUB_OUTPUT"

          if [ "$previous" = "$CLERK_JWT_ISSUER_DOMAIN" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Convex already trusts $CLERK_JWT_ISSUER_DOMAIN."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$CLERK_JWT_ISSUER_DOMAIN" | pnpm exec convex env set CLERK_JWT_ISSUER_DOMAIN

      - name: Deploy Convex development functions
        if: steps.gate.outputs.enabled == 'true'
        id: convex_deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: pnpm exec convex deploy --yes --typecheck=enable

      - name: Ensure staging public smoke fixture
        if: steps.gate.outputs.enabled == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: |
          set -euo pipefail
          printf '%s' staging | pnpm exec convex env set VRDEX_DEPLOYMENT_ENV
          printf '%s' true | pnpm exec convex env set VRDEX_ENABLE_HOSTED_SMOKE_FIXTURE
          pnpm exec convex run hostedSmokeFixtures:ensurePublicSearchFixture

      - name: Deploy Vercel staging
        if: steps.gate.outputs.enabled == 'true'
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deploy_args=(
            deploy
            --target=staging
            --yes
            --token "$VERCEL_TOKEN"
          )
          deployment_url=$(pnpm dlx vercel@54.4.1 "${deploy_args[@]}" | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "Vercel staging deployment did not return a URL." >&2
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Staging deploy"
            echo "Convex development functions deployed."
            echo "Vercel staging deployment: $deployment_url"
            echo "Hosted health target: ${{ steps.gate.outputs.hosted_base_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The two halves of staging auth are configured independently: Convex gets
      # its issuer from a repository variable, and Vercel gets its publishable
      # key from the Vercel project. Nothing previously compared them. A stale or
      # cross-instance issuer would deploy cleanly and then reject every
      # signed-in request, because Convex validates a token issuer it was told
      # about rather than the one the browser actually authenticated against —
      # and the preceding audit checks variable *names* only, so it cannot see
      # this.
      #
      # Decoded rather than prefix-matched, and compared against the deployment
      # that just went out. `production-promote.yml` does the same for the live
      # tenant; this is the staging counterpart with a `pk_test_` key.
      # Authoritative check on what actually shipped. The pre-mutation guard
      # above can be inconclusive when the target served no key; this one runs
      # against the deployment that just went out, so it always has one.
      - name: Verify the staging Clerk key matches the Convex issuer
        if: steps.gate.outputs.enabled == 'true'
        id: verify_issuer
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.VRDEX_STAGING_CLERK_JWT_ISSUER_DOMAIN }}
        run: |
          set -uo pipefail

          # Exit 2 is a confirmed mismatch: the deployed key names a different
          # Clerk instance than the issuer just written. Any other non-zero
          # status is a failure to reach or read the deployment, which proves
          # nothing about the pairing. Recorded so the rollback can tell them
          # apart — it must repair the first and must not act on the second.
          set +e
          node scripts/check-clerk-issuer-match.mjs \
            --base-url "$DEPLOYMENT_URL" \
            --issuer "$CLERK_JWT_ISSUER_DOMAIN"
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
          fi

          exit "$status"

      - name: Install Playwright Chromium
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run hosted staging data-flow health
        if: steps.gate.outputs.enabled == 'true'
        id: health
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.gate.outputs.hosted_base_url }}
          PLAYWRIGHT_RECORD_VIDEO: "true"
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
          VRDEX_ENABLE_E2E_EXTENDED_PROFILE_FLOW: ${{ vars.VRDEX_HOSTED_E2E_EXTENDED_PROFILE_FLOW }}
          VRDEX_ENABLE_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          VRDEX_ENABLE_E2E_ADAPTER_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_ADAPTER_HELPERS }}
          VRDEX_ENABLE_E2E_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          # Without these the Clerk-backed claim and developer-credential specs
          # report unavailable and skip, so this health step would pass after
          # every staging deployment without exercising any of the auth coverage
          # it is meant to protect. Same wiring as the baseline and
          # deployed-health lanes.
          VRDEX_ENABLE_E2E_CLERK_AUTH: ${{ vars.VRDEX_HOSTED_E2E_CLERK_AUTH }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          VRDEX_E2E_RUN_ID: staging-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:e2e:hosted



      # After the deployment it is testing, not before it. On a merge this used
      # to run from `deployed-health.yml` on the `push` event, which fires while
      # the matching Convex and Vercel deployments are still going out — so it
      # asserted against the *previous* deployment and reported that as the
      # health of this one.
      #
      # Gated on the Clerk flag for the same reason the deployed-health copy is:
      # without credentials the authenticated test skips, the signed-out one
      # passes, and Playwright exits 0 over a contract that never ran.
      - name: Run recurring staging auth session contract
        if: steps.gate.outputs.enabled == 'true' && vars.VRDEX_HOSTED_E2E_CLERK_AUTH == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.gate.outputs.hosted_base_url }}
          PLAYWRIGHT_RECORD_VIDEO: "true"
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
          # Distinct output locations. Playwright clears its report and results
          # directories when a run starts, so a second invocation sharing them
          # discarded the first run's report, traces, and videos before the
          # upload step could collect them.
          PLAYWRIGHT_OUTPUT_DIR: test-results-auth-session
          PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-auth-session
          # Needed since the config gained a JSON reporter. Without it this run
          # writes the default `playwright-artifacts/results.json` — the same
          # path the hosted health run above already wrote — so the uploaded
          # artifact would carry this suite's results under the health run's
          # name and lose the health results entirely.
          PLAYWRIGHT_JSON_REPORT_FILE: playwright-artifacts/results-auth-session.json
          VRDEX_ENABLE_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          VRDEX_ENABLE_E2E_CLERK_AUTH: ${{ vars.VRDEX_HOSTED_E2E_CLERK_AUTH }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          VRDEX_E2E_RUN_ID: staging-auth-session-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:e2e:hosted:auth-session

      # Last of the three Playwright runs, and below the auth-session contract on
      # purpose. An ordinary `if:` implicitly requires every prior step to have
      # succeeded, so sitting above that step meant a failed capture skipped it —
      # and it is the only staging run of `@auth-session-staging`, which
      # `test:e2e:hosted` does not select. Screenshots must not be able to
      # suppress the Clerk-to-Convex session seam.
      #
      # This is where the signed-in captures get their only run against a
      # deployment of the revision under test. `test:e2e:hosted` excludes
      # `@account-visual` because it has its own both-projects command, and the
      # PR-time lane shoots the staging target, which serves `main` — so before
      # this step the suite only ever photographed the revision it was not
      # reviewing. Here staging already holds the merged commit.
      #
      # The condition is `always()` *and* a successful `verify_issuer`, not one
      # or the other. `always()` alone would run this after a failed Vercel
      # deploy, against an alias still serving the previous revision, and file
      # those screenshots as evidence for this commit — the exact confusion this
      # step exists to remove, while minting disposable Clerk accounts to do it.
      # Plain success alone would skip the captures whenever a *test* step above
      # failed, which says nothing about whether the deployment is sound.
      # `verify_issuer` is the last link in the deploy chain, so its success
      # implies every deployment and verification step before it succeeded too.
      #
      # Also gated on the Clerk flag, like the contract step above: with it unset
      # every test skips and Playwright exits 0, so an ungated step would report
      # success over zero screenshots.
      #
      # Own output paths for the same reason as the other two runs: Playwright
      # clears its output and report directories on start.
      - name: Capture signed-in account screenshots
        if: >-
          always() && steps.gate.outputs.enabled == 'true'
          && steps.verify_issuer.conclusion == 'success'
          && vars.VRDEX_HOSTED_E2E_CLERK_AUTH == 'true'
        id: account-visual
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-account-visual
          PLAYWRIGHT_HTML_REPORT_DIR: playwright-report-account-visual
          PLAYWRIGHT_JSON_REPORT_FILE: playwright-artifacts/results-account-visual.json
          PLAYWRIGHT_BASE_URL: ${{ steps.gate.outputs.hosted_base_url }}
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
          VRDEX_ENABLE_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          VRDEX_ENABLE_E2E_CLERK_AUTH: ${{ vars.VRDEX_HOSTED_E2E_CLERK_AUTH }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          VRDEX_E2E_RUN_ID: staging-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:e2e:hosted:account-visual

      # Anything between the `env set` and the post-deploy verification failing
      # leaves Convex trusting an instance the deployed web app does not
      # authenticate against, which rejects every signed-in staging request. The
      # rotation path makes that reachable in practice: it skips the pre-deploy
      # comparison by design, so a mistyped or unpublished Vercel key is not
      # caught until after Convex has already been told to trust the new issuer.
      #
      # Two ways to reach it, and both mean the same thing: Convex is ahead of
      # what staging actually serves.
      #
      # Vercel not succeeding leaves it ahead outright.
      #
      # The post-deploy comparison reporting a *confirmed* mismatch — exit 2,
      # not merely a failed step — means the deployed key names a different
      # Clerk instance than the issuer just written. Keyed off that rather than
      # the step's outcome because a transient fetch error also fails the step,
      # and rolling back on one of those would break a pairing that is very
      # likely correct. The precheck can be inconclusive (a target serving no
      # key at all), so a mismatch is not unreachable just because it passed.
      #
      # Still runs last so a failure anywhere after the mutation reaches it, and
      # a skipped Vercel deploy also counts as not-succeeded.
      #
      # Re-pushes as well as restoring the variable, because `auth.config.ts` is
      # evaluated at push time — putting the value back without a deploy would
      # leave the running provider config on the value being rolled back.
      - name: Restore the previous Convex issuer
        if: >-
          failure()
          && steps.provision.outputs.changed == 'true'
          && steps.provision.outputs.previous_issuer != ''
          && (
            steps.vercel.outcome != 'success'
            || steps.verify_issuer.outputs.mismatch == 'true'
          )
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
          PREVIOUS_ISSUER: ${{ steps.provision.outputs.previous_issuer }}
          CONVEX_DEPLOY_OUTCOME: ${{ steps.convex_deploy.outcome }}
        run: |
          set -euo pipefail

          printf '%s' "$PREVIOUS_ISSUER" | pnpm exec convex env set CLERK_JWT_ISSUER_DOMAIN

          # Only re-push when the deploy that would have published the new issuer
          # actually succeeded. If it did not, nothing was pushed carrying the new
          # value — the running provider config is still the old one — so
          # restoring the variable is the whole repair. Re-pushing there would
          # publish the very functions that just failed their typecheck, with
          # typechecking turned off to get them through.
          if [ "$CONVEX_DEPLOY_OUTCOME" = "success" ]; then
            pnpm exec convex deploy --yes --typecheck=enable
            note="and functions re-pushed"
          else
            note="without re-pushing, because the Convex deploy that would have published it never succeeded"
          fi

          {
            echo ""
            echo "## Staging issuer rolled back"
            echo ""
            echo "This run changed the Convex issuer and then failed, so it was restored to \`$PREVIOUS_ISSUER\` $note. Staging is back on the instance it was serving before this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging deploy artifacts
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staging-deploy-health
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-report-auth-session
            apps/web/test-results-auth-session
            apps/web/playwright-report-account-visual
            apps/web/test-results-account-visual
            apps/web/playwright-artifacts
