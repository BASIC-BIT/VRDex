# .github/workflows/claude-review.yml in each repository. Must stay pull_request_target: the
# shared role only trusts tokens whose ref is the default branch (see the README).
name: Claude review
on:
  pull_request_target:
    # No branches filter: closed/retarget events must still cancel an in-flight review.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed
      - edited
      - unlabeled
permissions: {}
jobs:
  review:
    # One live review per PR; label noise, title edits and manual re-runs get their own group.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}-${{ (github.run_attempt != '1' || github.event.action == 'unlabeled' || (github.event.action == 'edited' && !github.event.changes.base)) && github.run_id || 'live' }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    # Pinned to a full commit SHA, never a tag: the role trusts this exact job_workflow_ref.
    uses: BASIC-BIT/claude-review/.github/workflows/review.yml@b1431cc7f787fc29237d42c1bc1a184dd1db5f2a # v1.1.0
