name: Claude Review Control

on:
  pull_request_target:
    types: [labeled, converted_to_draft, closed, edited]

permissions:
  contents: read

concurrency:
  group: ${{ ((github.event.action == 'labeled' && github.event.label.name == 'skip-claude-review') || github.event.action == 'converted_to_draft' || github.event.action == 'closed' || (github.event.action == 'edited' && github.event.changes.base != null)) && format('claude-review-control-{0}', github.event.pull_request.number) || format('claude-review-control-noop-{0}', github.run_id) }}
  cancel-in-progress: ${{ (github.event.action == 'labeled' && github.event.label.name == 'skip-claude-review') || github.event.action == 'converted_to_draft' || github.event.action == 'closed' || (github.event.action == 'edited' && github.event.changes.base != null) }}

jobs:
  mark-unavailable:
    name: Mark Claude review unavailable
    if: >-
      !github.event.pull_request.head.repo.fork &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      (((github.event.action == 'labeled' && github.event.label.name == 'skip-claude-review') ||
      github.event.action == 'converted_to_draft' || github.event.action == 'closed') &&
      github.event.pull_request.base.ref == 'main' ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    concurrency:
      group: claude-review-mutation-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Upsert unavailable sticky comment
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_BASE_REF: ${{ github.event.changes.base.ref.from }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STICKY_MARKER: '<!-- claude-pr-review -->'
        shell: bash
        run: |
          set -euo pipefail

          body_file="${RUNNER_TEMP}/claude-review-comment.md"
          json_file="${RUNNER_TEMP}/claude-review-comment.json"

          IFS=$'\t' read -r live_state live_head live_base live_base_sha live_draft live_skipped live_merged <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.state, .head.sha, .base.ref, .base.sha, .draft, (.labels | map(.name) | index("skip-claude-review") != null), .merged] | @tsv'
          )"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-pr-review -->"))) | .id' |
              tail -n 1
          )"
          in_scope=false
          if [ "$live_base" = "main" ] || [ "$EVENT_BASE_REF" = "main" ] || \
             [ "$PREVIOUS_BASE_REF" = "main" ] || [ -n "$comment_id" ]; then
            in_scope=true
          fi
          if [ "$in_scope" != "true" ]; then
            echo "::notice::The pull request has never entered Claude review scope."
            exit 0
          fi

          if [ "$live_state" != "open" ]; then
            if [ "$live_merged" = "true" ]; then reason='the pull request was merged';
            else reason='the pull request was closed'; fi
          elif [ "$live_base" != "main" ]; then
            reason="the pull request base changed to \`${live_base}\`"
          elif [ "$live_skipped" = "true" ]; then
            reason='the `skip-claude-review` label is applied'
          elif [ "$live_draft" = "true" ]; then
            reason='the pull request is a draft'
          else
            [ -n "$comment_id" ] || exit 0
            existing_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --jq '.body')"
            reviewed_head="$(
              printf '%s\n' "$existing_body" |
                sed -n 's/^<!-- claude-pr-review-head:\([0-9a-f]*\) -->$/\1/p' |
                tail -n 1
            )"
            reviewed_base="$(
              printf '%s\n' "$existing_body" |
                sed -n 's/^<!-- claude-pr-review-base:\([0-9a-f]*\) -->$/\1/p' |
                tail -n 1
            )"
            if printf '%s' "$existing_body" | grep -qF '<!-- claude-pr-review-complete -->' && \
               [ "$reviewed_head" = "$live_head" ] && [ "$reviewed_base" = "$live_base_sha" ]; then
              exit 0
            fi
            reason='no completed result covers the live head and base'
          fi

          cat > "$body_file" <<EOF
          ${STICKY_MARKER}
          [AGENT]

          ## Claude Review

          Claude review for commit \`${live_head}\` is unavailable because ${reason}.

          This is not a current review or approval.
          EOF

          node - "$body_file" "$json_file" <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.argv[3], JSON.stringify({
            body: fs.readFileSync(process.argv[2], "utf8"),
          }));
          NODE

          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$json_file" > /dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "$json_file" > /dev/null
          fi

          all_comment_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-pr-review -->"))) | .id'
          )"
          keep_comment_id="$(printf '%s\n' "$all_comment_ids" | tail -n 1)"
          while IFS= read -r duplicate_id; do
            if [ -n "$duplicate_id" ] && [ "$duplicate_id" != "$keep_comment_id" ]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${duplicate_id}" > /dev/null
            fi
          done <<< "$all_comment_ids"
