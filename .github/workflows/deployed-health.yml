name: Deployed Health Checks

on:
  deployment_status:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Which deployed health check to run
        required: true
        default: all
        type: choice
        options:
          - all
          - staging-mutation
          - production-smoke
          - hosted-mcp-smoke
      base_url:
        description: Optional URL override for the selected target
        required: false
        type: string
      mcp_dcr:
        default: false
        description: Probe hosted MCP Dynamic Client Registration
        required: true
        type: boolean
      mcp_data:
        default: false
        description: Probe hosted MCP data-backed public reads
        required: true
        type: boolean
      mcp_cimd:
        default: false
        description: Probe hosted MCP Client ID Metadata Document authorization
        required: true
        type: boolean
      mcp_oauth:
        default: false
        description: Probe hosted MCP Inspector OAuth with configured smoke credentials
        required: true
        type: boolean
      production_auth:
        default: false
        description: Run the manual one-shot production authenticated account read
        required: true
        type: boolean
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: deployed-health-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-data-flow:
    name: Hosted Data Flow Health
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'staging-mutation'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check hosted data-flow configuration
        id: gate
        env:
          HOSTED_BASE_URL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'staging-mutation' && inputs.base_url || '' }}
          HOSTED_BASE_URL_VAR: ${{ vars.VRDEX_HOSTED_E2E_BASE_URL }}
          HOSTED_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
        run: |
          set -euo pipefail

          HOSTED_BASE_URL="${HOSTED_BASE_URL_OVERRIDE:-${HOSTED_BASE_URL_VAR:-}}"

          if [ -z "$HOSTED_BASE_URL" ] || [ -z "$HOSTED_BROWSER_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Hosted data-flow health"
              echo "Skipped because VRDEX_HOSTED_E2E_BASE_URL or VRDEX_HOSTED_E2E_BROWSER_TOKEN is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "base_url=$HOSTED_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run hosted mutation-backed profile submission flow
        if: steps.gate.outputs.enabled == 'true'
        id: hosted
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.gate.outputs.base_url }}
          PLAYWRIGHT_RECORD_VIDEO: "true"
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
          VRDEX_ENABLE_E2E_EXTENDED_PROFILE_FLOW: ${{ vars.VRDEX_HOSTED_E2E_EXTENDED_PROFILE_FLOW }}
          VRDEX_ENABLE_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          VRDEX_ENABLE_E2E_ADAPTER_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_ADAPTER_HELPERS }}
          VRDEX_ENABLE_E2E_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          VRDEX_ENABLE_E2E_CLERK_AUTH: ${{ vars.VRDEX_HOSTED_E2E_CLERK_AUTH }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          VRDEX_E2E_RUN_ID: deployed-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:e2e:hosted

      # Re-enabled by #226. The spec no longer tests Convex Auth refresh
      # internals — it asserts that a Clerk session resolves to a verified
      # Convex identity on this deployment, which is what a drifted `convex` JWT
      # template or `CLERK_JWT_ISSUER_DOMAIN` breaks.
      #
      # Gated on the Clerk-auth flag as well as the hosted-data gate. Without
      # that, the step ran with no Clerk credentials: the authenticated test
      # skipped, the signed-out redirect test passed, Playwright exited 0, and
      # the summary reported the session contract as successful while the
      # identity, reload, sibling-tab, and sign-out assertions never ran.
      #
      # With the flag on and the keys missing it errors rather than skipping, so
      # it cannot go back to reporting green over nothing either way.
      - name: Run recurring staging auth session contract
        if: steps.gate.outputs.enabled == 'true' && vars.VRDEX_HOSTED_E2E_CLERK_AUTH == 'true'
        id: auth_session
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.gate.outputs.base_url }}
          PLAYWRIGHT_RECORD_VIDEO: "true"
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
          # Not hard-coded "true". The spec's own skip reads this, so forcing it
          # on against a deployment whose auth helper is disabled let the
          # identity assertions run — they do not touch `/api/e2e/auth` — while
          # the cleanup DELETE silently took a 403, leaving the provisioned
          # Convex user behind and the contract reported as successful.
          VRDEX_ENABLE_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          VRDEX_ENABLE_E2E_CLERK_AUTH: ${{ vars.VRDEX_HOSTED_E2E_CLERK_AUTH }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          VRDEX_E2E_RUN_ID: deployed-auth-session-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:e2e:hosted:auth-session

      - name: Write hosted data-flow summary
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          HOSTED_OUTCOME: ${{ steps.hosted.outcome }}
          HOSTED_BASE_URL: ${{ steps.gate.outputs.base_url }}
          HOSTED_EXTENDED_PROFILE_FLOW: ${{ vars.VRDEX_HOSTED_E2E_EXTENDED_PROFILE_FLOW }}
          HOSTED_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          HOSTED_ADAPTER_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_ADAPTER_HELPERS }}
          HOSTED_AUTH_SESSION_OUTCOME: ${{ steps.auth_session.outcome }}
          HOSTED_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          HOSTED_CLERK_AUTH: ${{ vars.VRDEX_HOSTED_E2E_CLERK_AUTH }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/hosted-data-flow-health-summary.md <<EOF
          ## Hosted data-flow health

          Outcome: ${HOSTED_OUTCOME}

          Target: ${HOSTED_BASE_URL}

          Hosted extended profile flow: ${HOSTED_EXTENDED_PROFILE_FLOW:-skipped}

          Hosted auth helpers: ${HOSTED_AUTH_HELPERS:-skipped}

          Hosted adapter helpers: ${HOSTED_ADAPTER_HELPERS:-skipped}

          Recurring auth session contract: ${HOSTED_AUTH_SESSION_OUTCOME:-not run}

          Hosted developer credentials: ${HOSTED_DEVELOPER_CREDENTIALS:-skipped}

          Clerk test auth: ${HOSTED_CLERK_AUTH:-skipped}

          The flags above report configuration, not coverage. With
          \`VRDEX_HOSTED_E2E_CLERK_AUTH\` unset the auth-backed specs skip and
          only the captured flow below ran; with it set they fail rather than
          skip when the Clerk keys are missing.

          Captured flow:
          - hosted test-gated profile submission form
          - hosted Convex profile creation
          - hosted public profile page readback
          - hosted discovery search readback
          - hosted E2E cleanup

          Auth session contract (separate step above, when Clerk test auth is on):
          - a Clerk session resolves to a verified Convex identity
          - the session survives a reload and a sibling tab
          - sign-out returns protected routes to the sign-in redirect

          Run: ${RUN_URL}
          EOF

      - name: Upload hosted data-flow health artifacts
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-hosted-data-flow-health
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-artifacts

  production-smoke:
    name: Production Smoke Health
    if: (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')) || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'production-smoke'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check production smoke configuration
        id: gate
        env:
          DEPLOYMENT_STATUS_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || '' }}
          PRODUCTION_AUTH_REQUESTED: ${{ inputs.production_auth || false }}
          PRODUCTION_BASE_URL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production-smoke' && inputs.base_url || '' }}
          PRODUCTION_BASE_URL_VAR: ${{ vars.VRDEX_PRODUCTION_SMOKE_BASE_URL }}
        run: |
          set -euo pipefail

          PRODUCTION_BASE_URL="${DEPLOYMENT_STATUS_BASE_URL:-${PRODUCTION_BASE_URL_OVERRIDE:-${PRODUCTION_BASE_URL_VAR:-}}}"
          PRODUCTION_CANONICAL_BASE_URL="${PRODUCTION_BASE_URL_OVERRIDE:-${PRODUCTION_BASE_URL_VAR:-}}"

          if [ -z "$PRODUCTION_BASE_URL" ]; then
            if [ "$PRODUCTION_AUTH_REQUESTED" = "true" ]; then
              {
                echo "## Production smoke health"
                echo "Failed because production_auth was requested but no production base URL is configured."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Production smoke health"
              echo "Skipped because VRDEX_PRODUCTION_SMOKE_BASE_URL is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "base_url=$PRODUCTION_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "canonical_base_url=$PRODUCTION_CANONICAL_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production read-only route smoke
        if: steps.gate.outputs.enabled == 'true'
        id: smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.gate.outputs.base_url }}
          PLAYWRIGHT_RECORD_VIDEO: "true"
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
        run: pnpm test:e2e:hosted:smoke

      - name: Check production authenticated smoke configuration
        if: steps.gate.outputs.enabled == 'true'
        id: auth_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_AUTH_BASE_URL: ${{ steps.gate.outputs.canonical_base_url }}
          PRODUCTION_AUTH_REQUESTED: ${{ inputs.production_auth || false }}
          PRODUCTION_AUTH_STORAGE_STATE_B64: ${{ secrets.VRDEX_PRODUCTION_AUTH_SMOKE_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$PRODUCTION_AUTH_REQUESTED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Production authenticated account smoke"
              echo "Skipped because authenticated production reads are manual one-shot checks."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$PRODUCTION_AUTH_BASE_URL" ] || [ -z "$PRODUCTION_AUTH_STORAGE_STATE_B64" ]; then
            {
              echo "## Production authenticated account smoke"
              echo "Failed because production_auth was requested but VRDEX_PRODUCTION_SMOKE_BASE_URL or VRDEX_PRODUCTION_AUTH_SMOKE_STORAGE_STATE_B64 is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Run production authenticated account smoke
        if: steps.auth_gate.outputs.enabled == 'true'
        id: auth_smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.gate.outputs.canonical_base_url }}
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
          VRDEX_PRODUCTION_AUTH_SMOKE_MODE: manual-one-shot
          VRDEX_PRODUCTION_AUTH_SMOKE_STORAGE_STATE_B64: ${{ secrets.VRDEX_PRODUCTION_AUTH_SMOKE_STORAGE_STATE_B64 }}
        run: pnpm test:e2e:hosted:auth-smoke

      - name: Write production smoke summary
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          AUTH_SMOKE_OUTCOME: ${{ steps.auth_smoke.outcome }}
          PRODUCTION_AUTH_BASE_URL: ${{ steps.gate.outputs.canonical_base_url }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PRODUCTION_BASE_URL: ${{ steps.gate.outputs.base_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/production-smoke-health-summary.md <<EOF
          ## Production smoke health

          Outcome: ${SMOKE_OUTCOME}

          Target: ${PRODUCTION_BASE_URL}

          Authenticated account smoke: ${AUTH_SMOKE_OUTCOME:-skipped}

          Authenticated account target: ${PRODUCTION_AUTH_BASE_URL:-not configured}

          Captured flow:
          - hosted public route smoke checks
          - hosted deployment and server-status pages
          - optional manual one-shot authenticated account readback with a freshly exported production test-account storage state
          - no mutation-backed E2E helpers

          Run: ${RUN_URL}
          EOF

      - name: Upload production smoke health artifacts
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-production-smoke-health
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-artifacts

  hosted-mcp-smoke:
    name: Hosted MCP Smoke Health
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'hosted-mcp-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check hosted MCP smoke configuration
        id: gate
        env:
          MCP_BASE_URL_OVERRIDE: ${{ inputs.base_url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.VRDEX_MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.VRDEX_MCP_OAUTH_CLIENT_SECRET }}
          MCP_OAUTH_REQUESTED: ${{ inputs.mcp_oauth }}
          MCP_INSPECTOR_OAUTH_TOKEN: ${{ secrets.VRDEX_MCP_INSPECTOR_OAUTH_TOKEN }}
          MCP_HOSTED_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          MCP_HOSTED_E2E_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          MCP_HOSTED_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          MCP_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
          MCP_CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$MCP_BASE_URL_OVERRIDE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "oauth_enabled=false" >> "$GITHUB_OUTPUT"
            echo "openai_oauth_enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Hosted MCP smoke health"
              echo "Skipped because base_url was not provided."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          OAUTH_ENABLED=false
          OAUTH_SOURCE=skipped
          GENERATE_OAUTH_CREDENTIALS=false
          if [ "$MCP_OAUTH_REQUESTED" = "true" ]; then
            if { [ -n "$MCP_OAUTH_CLIENT_ID" ] && [ -n "$MCP_OAUTH_CLIENT_SECRET" ]; } || [ -n "$MCP_INSPECTOR_OAUTH_TOKEN" ]; then
              OAUTH_ENABLED=true
              OAUTH_SOURCE=configured-repository-secret
            elif [ "$MCP_HOSTED_E2E_AUTH_HELPERS" = "true" ] && [ "$MCP_HOSTED_E2E_DEVELOPER_CREDENTIALS" = "true" ] && [ -n "$MCP_HOSTED_E2E_BROWSER_TOKEN" ]; then
              # #226 ported the generator to Clerk testing credentials, so it
              # needs the staging Clerk development instance keys as well as the
              # helper flags above. Without them it would launch a browser and
              # fail on sign-in, so skip with a reason instead.
              if [ -n "$MCP_CLERK_SECRET_KEY" ] && [ -n "$MCP_CLERK_PUBLISHABLE_KEY" ]; then
                OAUTH_ENABLED=true
                OAUTH_SOURCE=generated-e2e-credential
                GENERATE_OAUTH_CREDENTIALS=true
              else
                {
                  echo "## Hosted MCP smoke health"
                  echo ""
                  echo "Hosted MCP Inspector OAuth was requested but the generated-credential path needs Clerk keys: set the VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY and VRDEX_HOSTED_E2E_CLERK_SECRET_KEY repository secrets for the staging Clerk development instance, or configure VRDEX_MCP_OAUTH_CLIENT_ID plus VRDEX_MCP_OAUTH_CLIENT_SECRET, or VRDEX_MCP_INSPECTOR_OAUTH_TOKEN."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              {
                echo "## Hosted MCP smoke health"
                echo ""
                echo "Hosted MCP Inspector OAuth was requested but skipped because neither VRDEX_MCP_OAUTH_CLIENT_ID plus VRDEX_MCP_OAUTH_CLIENT_SECRET nor VRDEX_MCP_INSPECTOR_OAUTH_TOKEN is configured, and hosted E2E auth/developer credential generation is not fully enabled."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          OPENAI_OAUTH_ENABLED=false
          if [ "$OAUTH_ENABLED" = "true" ] && [ -n "$OPENAI_API_KEY" ]; then
            if { [ -n "$MCP_OAUTH_CLIENT_ID" ] && [ -n "$MCP_OAUTH_CLIENT_SECRET" ]; } || [ "$GENERATE_OAUTH_CREDENTIALS" = "true" ]; then
              OPENAI_OAUTH_ENABLED=true
            fi
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "mcp_url=$MCP_BASE_URL_OVERRIDE" >> "$GITHUB_OUTPUT"
          echo "oauth_enabled=$OAUTH_ENABLED" >> "$GITHUB_OUTPUT"
          echo "oauth_source=$OAUTH_SOURCE" >> "$GITHUB_OUTPUT"
          echo "generate_oauth_credentials=$GENERATE_OAUTH_CREDENTIALS" >> "$GITHUB_OUTPUT"
          echo "openai_oauth_enabled=$OPENAI_OAUTH_ENABLED" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.generate_oauth_credentials == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare hosted MCP OAuth smoke credentials
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.generate_oauth_credentials == 'true'
        env:
          SMOKE_URL: ${{ steps.gate.outputs.mcp_url }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.VRDEX_HOSTED_E2E_CLERK_SECRET_KEY }}
          VRDEX_E2E_RUN_ID: deployed-mcp-oauth-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          pnpm ops:mcp-oauth-smoke-credentials -- --base-url "$SMOKE_URL"

          . .tmp-gh-artifacts/mcp-oauth-smoke-credentials/mcp-oauth-smoke-env.sh

          echo "::add-mask::$VRDEX_MCP_OAUTH_CLIENT_SECRET"
          {
            echo "VRDEX_MCP_OAUTH_CLIENT_ID=$VRDEX_MCP_OAUTH_CLIENT_ID"
            echo "VRDEX_MCP_OAUTH_CLIENT_SECRET=$VRDEX_MCP_OAUTH_CLIENT_SECRET"
            # Carried so the teardown at the end of this job can delete the
            # Convex user and its OAuth application. The generator deletes only
            # the Clerk user; everything on the VRDex side has to outlive it,
            # because the smokes below still need the client.
            echo "VRDEX_MCP_OAUTH_SMOKE_ACCOUNT_EMAIL=$VRDEX_MCP_OAUTH_SMOKE_ACCOUNT_EMAIL"
          } >> "$GITHUB_ENV"

          {
            echo ""
            echo "## Hosted MCP OAuth smoke credentials"
            echo ""
            echo "- Credential source: temporary E2E-reviewed OAuth app"
            echo "- Target: \`$VRDEX_MCP_INSPECTOR_HOSTED_URL\`"
            echo "- Client secret printed: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run hosted MCP smoke
        if: steps.gate.outputs.enabled == 'true'
        env:
          SMOKE_CIMD: ${{ inputs.mcp_cimd }}
          SMOKE_DATA: ${{ inputs.mcp_data }}
          SMOKE_DCR: ${{ inputs.mcp_dcr }}
          SMOKE_OAUTH: ${{ inputs.mcp_oauth }}
          SMOKE_OAUTH_ENABLED: ${{ steps.gate.outputs.oauth_enabled }}
          SMOKE_OAUTH_SOURCE: ${{ steps.gate.outputs.oauth_source }}
          SMOKE_URL: ${{ steps.gate.outputs.mcp_url }}
        run: |
          set -euo pipefail

          args=(--hosted-only --hosted-url "$SMOKE_URL" --continue-on-failure)

          if [ "$SMOKE_DATA" = "true" ]; then
            args+=(--hosted-data)
          fi

          if [ "$SMOKE_DCR" = "true" ]; then
            args+=(--dcr)
          fi

          if [ "$SMOKE_CIMD" = "true" ]; then
            args+=(--cimd)
          fi

          {
            echo "## Hosted MCP smoke health"
            echo ""
            echo "- Target: \`$SMOKE_URL\`"
            echo "- Data-backed public reads: \`$SMOKE_DATA\`"
            echo "- Dynamic Client Registration: \`$SMOKE_DCR\`"
            echo "- Client ID Metadata Document: \`$SMOKE_CIMD\`"
            echo "- Inspector OAuth requested: \`$SMOKE_OAUTH\`"
            echo "- Inspector OAuth enabled: \`$SMOKE_OAUTH_ENABLED\`"
            echo "- Inspector OAuth credential source: \`$SMOKE_OAUTH_SOURCE\`"
            echo "- Continue selected hosted diagnostics after a subcheck failure: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm smoke:mcp-compat -- "${args[@]}"

      - name: Run hosted MCP Inspector OAuth smoke
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.oauth_enabled == 'true'
        env:
          CONFIGURED_MCP_OAUTH_CLIENT_ID: ${{ secrets.VRDEX_MCP_OAUTH_CLIENT_ID }}
          CONFIGURED_MCP_OAUTH_CLIENT_SECRET: ${{ secrets.VRDEX_MCP_OAUTH_CLIENT_SECRET }}
          VRDEX_MCP_INSPECTOR_OAUTH_TOKEN: ${{ secrets.VRDEX_MCP_INSPECTOR_OAUTH_TOKEN }}
          SMOKE_OAUTH_SOURCE: ${{ steps.gate.outputs.oauth_source }}
          SMOKE_URL: ${{ steps.gate.outputs.mcp_url }}
        run: |
          set -euo pipefail

          if [ -n "${CONFIGURED_MCP_OAUTH_CLIENT_ID:-}" ] && [ -n "${CONFIGURED_MCP_OAUTH_CLIENT_SECRET:-}" ]; then
            export VRDEX_MCP_OAUTH_CLIENT_ID="$CONFIGURED_MCP_OAUTH_CLIENT_ID"
            export VRDEX_MCP_OAUTH_CLIENT_SECRET="$CONFIGURED_MCP_OAUTH_CLIENT_SECRET"
          fi

          {
            echo ""
            echo "## Hosted MCP Inspector OAuth smoke"
            echo ""
            echo "- Target: \`$SMOKE_URL\`"
            echo "- OAuth credential source: \`$SMOKE_OAUTH_SOURCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm smoke:mcp-inspector -- --hosted-url "$SMOKE_URL" --hosted-data

      - name: Run OpenAI Responses hosted MCP OAuth smoke
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.openai_oauth_enabled == 'true'
        env:
          CONFIGURED_MCP_OAUTH_CLIENT_ID: ${{ secrets.VRDEX_MCP_OAUTH_CLIENT_ID }}
          CONFIGURED_MCP_OAUTH_CLIENT_SECRET: ${{ secrets.VRDEX_MCP_OAUTH_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMOKE_OAUTH_SOURCE: ${{ steps.gate.outputs.oauth_source }}
          SMOKE_URL: ${{ steps.gate.outputs.mcp_url }}
        run: |
          set -euo pipefail

          if [ -n "${CONFIGURED_MCP_OAUTH_CLIENT_ID:-}" ] && [ -n "${CONFIGURED_MCP_OAUTH_CLIENT_SECRET:-}" ]; then
            export VRDEX_MCP_OAUTH_CLIENT_ID="$CONFIGURED_MCP_OAUTH_CLIENT_ID"
            export VRDEX_MCP_OAUTH_CLIENT_SECRET="$CONFIGURED_MCP_OAUTH_CLIENT_SECRET"
          fi

          {
            echo ""
            echo "## OpenAI Responses hosted MCP OAuth smoke"
            echo ""
            echo "- Target: \`$SMOKE_URL\`"
            echo "- Model: \`gpt-5.6-luna\`"
            echo "- OAuth credential source: \`$SMOKE_OAUTH_SOURCE\`"
            echo "- ChatGPT Apps/Connectors UI evidence: \`not exercised\`"
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm smoke:mcp-openai -- --hosted-url "$SMOKE_URL" --hosted-data

      # Always, so a failed or cancelled smoke does not strand the account.
      # The generator deletes the Clerk user at its own exit, but the Convex
      # user, its confidential OAuth application, that application's client
      # secret, and any issued access tokens have to outlive it — the smokes
      # above need the client. Without this every dispatch left the whole set
      # behind in staging permanently.
      - name: Tear down generated MCP OAuth smoke credentials
        if: always() && steps.gate.outputs.generate_oauth_credentials == 'true' && env.VRDEX_MCP_OAUTH_SMOKE_ACCOUNT_EMAIL != ''
        env:
          SMOKE_URL: ${{ steps.gate.outputs.mcp_url }}
          E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
        run: |
          set -euo pipefail

          origin=$(printf '%s' "$SMOKE_URL" | sed -E 's#(https?://[^/]+).*##')
          status=$(curl -sS -o /tmp/mcp-oauth-teardown.json -w '%{http_code}'             -X DELETE "$origin/api/e2e/auth"             -H "x-vrdex-e2e-token: $E2E_BROWSER_TOKEN"             -H 'content-type: application/json'             --data "{\"email\":\"$VRDEX_MCP_OAUTH_SMOKE_ACCOUNT_EMAIL\"}")

          if [ "$status" != "200" ]; then
            echo "::warning::Teardown of the generated MCP OAuth account returned HTTP $status. The Convex user and its OAuth application may still exist in staging."
            exit 0
          fi

          echo "Deleted the generated MCP OAuth smoke account and its OAuth application."
