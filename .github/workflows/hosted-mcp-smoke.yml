name: Hosted MCP Smoke

on:
  workflow_dispatch:
    inputs:
      mcp_url:
        description: Hosted /mcp URL or deployment base URL.
        required: true
        type: string
      dcr:
        default: false
        description: Probe Dynamic Client Registration.
        required: true
        type: boolean
      cimd:
        default: false
        description: Probe Client ID Metadata Document authorization.
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: hosted-mcp-smoke-${{ github.ref }}-${{ inputs.mcp_url }}
  cancel-in-progress: false

jobs:
  hosted-mcp-smoke:
    name: Hosted MCP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hosted MCP smoke
        env:
          SMOKE_CIMD: ${{ inputs.cimd }}
          SMOKE_DCR: ${{ inputs.dcr }}
          SMOKE_URL: ${{ inputs.mcp_url }}
        run: |
          args=(--hosted-url "$SMOKE_URL")

          if [ "$SMOKE_DCR" = "true" ]; then
            args+=(--dcr)
          fi

          if [ "$SMOKE_CIMD" = "true" ]; then
            args+=(--cimd)
          fi

          {
            echo "## Hosted MCP smoke"
            echo ""
            echo "- Target: \`$SMOKE_URL\`"
            echo "- Dynamic Client Registration: \`$SMOKE_DCR\`"
            echo "- Client ID Metadata Document: \`$SMOKE_CIMD\`"
          } >> "$GITHUB_STEP_SUMMARY"

          pnpm smoke:mcp-compat -- "${args[@]}"
