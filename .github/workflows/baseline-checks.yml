  pr-verification-report:
    name: PR Verification Report
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs:
      - playwright-data-flow
      - playwright-hosted-data-flow
      - playwright-public-preview
      - playwright-image-diff
      - storybook-component-preview
      - storybook-image-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test PR verification report helper
        run: node --test .github/scripts/pr-verification-report.test.cjs

      - name: Update consolidated PR verification report
        uses: actions/github-script@v9
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const { updatePrVerificationReport } = require(
              "./.github/scripts/pr-verification-report.cjs",
            );
            await updatePrVerificationReport({
              core,
              context,
              github,
              needs: JSON.parse(process.env.NEEDS_JSON),
            });
