name: Baseline Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint:web

  typecheck-web:
    name: Typecheck Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck:web

  typecheck-backend:
    name: Typecheck Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend typecheck
        run: pnpm typecheck:backend

      - name: Run backend unit tests
        run: pnpm test:backend

  verify-backend-local:
    name: Verify Backend Local
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify backend bootstrap
        run: pnpm verify:backend:local

      - name: Check generated backend files
        run: git diff --exit-code -- convex/_generated

  build-web:
    name: Build Web
    needs: [lint-web, typecheck-web, typecheck-backend, verify-backend-local]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build:web

  playwright-public-preview:
    name: Playwright Public Preview
    if: github.event_name == 'pull_request'
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture public route screenshots
        id: visual
        run: pnpm test:e2e:visual

      - name: Write visual summary
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/visual-summary.md <<EOF
          ## Playwright public screenshot preview

          Outcome: ${VISUAL_OUTCOME}

          Captured routes:
          - /
          - /submit
          - /server-status
          - /deployment
          - /p/playwright-dj-aurora
          - /c/playwright-afterglow-social

          Run: ${RUN_URL}
          EOF

      - name: Upload Playwright artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-public-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-artifacts

      - name: Comment with screenshot artifact
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = "<!-- vrdex-playwright-public-preview -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const artifactUrl = process.env.ARTIFACT_URL || "";
            const outcome = process.env.VISUAL_OUTCOME || "unknown";
            const artifactLine = artifactUrl
              ? `Artifact: [playwright-public-preview](${artifactUrl})`
              : "Artifact: not generated";
            const body = [
              marker,
              "## Playwright Public Screenshot Preview",
              `Outcome: ${outcome}`,
              `Run: ${runUrl}`,
              artifactLine,
              "",
              "Captured routes:",
              "- `/`",
              "- `/submit`",
              "- `/server-status`",
              "- `/deployment`",
              "- `/p/playwright-dj-aurora`",
              "- `/c/playwright-afterglow-social`",
              "",
              "This job is required for PR checks; pixel diff baselines are not enabled yet.",
            ].join("\n");

            let comments = [];
            let page = 1;
            while (true) {
              const { data: pageComments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100,
                page,
              });
              comments = comments.concat(pageComments);
              if (pageComments.length < 100) break;
              page++;
            }
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  vercel-preview:
    name: Vercel Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: [playwright-public-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Vercel deployment secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel preview"
              echo "Deployment skipped because one or more required secrets are missing."
              echo ""
              echo "Required repository secrets:"
              echo "- VERCEL_TOKEN"
              echo "- VERCEL_ORG_ID"
              echo "- VERCEL_PROJECT_ID"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel preview environment
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build Vercel preview output
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest build --target=preview --token "$VERCEL_TOKEN"

      - name: Deploy Vercel preview output
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url=$(pnpm dlx vercel@latest deploy --prebuilt --target=preview --token "$VERCEL_TOKEN" | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "Vercel deployment did not return a URL." >&2
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Vercel preview"
            echo "Deployment: $deployment_url"
            echo "Deployment check page: $deployment_url/deployment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment with Vercel preview URL
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vrdex-vercel-preview -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "## Vercel Preview Deployment",
              `Preview: ${deploymentUrl}`,
              `Deployment check: ${deploymentUrl}/deployment`,
              `Run: ${runUrl}`,
            ].join("\n");

            let comments = [];
            let page = 1;
            while (true) {
              const { data: pageComments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100,
                page,
              });
              comments = comments.concat(pageComments);
              if (pageComments.length < 100) break;
              page++;
            }
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
