name: Baseline Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint:web

  verify-docs:
    name: Verify Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run docs verification
        run: pnpm verify:docs

  verify-api-mcp:
    name: Verify API and MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API contract verification
        run: pnpm verify:api-contracts

      - name: Run MCP package verification
        run: pnpm verify:vrdex-mcp

  typecheck-web:
    name: Typecheck Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck:web

      - name: Run web unit tests
        run: pnpm test:web

  typecheck-backend:
    name: Typecheck Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend typecheck
        run: pnpm typecheck:backend

      - name: Run backend unit tests
        run: pnpm test:backend

  verify-backend-local:
    name: Verify Backend Local
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify backend bootstrap
        run: pnpm verify:backend:local

      - name: Check generated backend files
        run: git diff --exit-code -- convex/_generated

  restream-local-checks:
    name: Restream Local Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check restream-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi

          changed_files="$(git diff --name-only "$base" HEAD)"
          restream_files="$(printf '%s\n' "$changed_files" | grep -E '^(\.github/workflows/(baseline-checks|terraform)\.yml|apps/discord-gateway/.*|workers/restream/.*|scripts/restream-(ffmpeg-proof\.mjs|local-validation\.ts)|convex/(_eventMediaControl|schema)\.ts|convex/README\.md|tests/backend/event-media-control\.test\.ts|docs/(backend/event-schema\.md|deployment/(discord-gateway|restream-worker)\.md|engineering/restream-ffmpeg-proof\.md)|infra/terraform/(README\.md|restream-worker/.*)|package\.json|pnpm-lock\.yaml)$' || true)"

          if [ -z "$restream_files" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Restream Local Checks"
              echo "Skipped because no restream-relevant files changed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Restream Local Checks"
            echo "Changed restream-relevant files:"
            printf -- '- `%s`\n' $restream_files
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        if: steps.changes.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.changes.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        if: steps.changes.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Typecheck Discord Gateway
        if: steps.changes.outputs.enabled == 'true'
        run: pnpm typecheck:discord-gateway

      - name: Test Discord Gateway
        if: steps.changes.outputs.enabled == 'true'
        run: pnpm test:discord-gateway

      - name: Build hosted restream worker image
        if: steps.changes.outputs.enabled == 'true'
        run: docker build -f workers/restream/Dockerfile -t vrdex-restream-worker:ci .

      - name: Dry-run hosted restream worker image
        if: steps.changes.outputs.enabled == 'true'
        run: |
          docker run --rm \
            -e CONVEX_URL=https://example.invalid \
            -e VRDEX_RESTREAM_BENCHMARK_MODE=dry-run \
            -e VRDEX_RESTREAM_QUALITY_GATE=1080p60 \
            -e VRDEX_RESTREAM_MAX_CONCURRENT_WORKERS=10 \
            -e VRDEX_RESTREAM_MAX_SESSION_SECONDS=43200 \
            -e VRDEX_RESTREAM_KILL_SWITCH_SSM_PARAMETER=/vrdex/restream/hosted-worker/enabled \
            -e VRDEX_RESTREAM_SECRET_REF_NAMES=event-media/vrcdn/main-output \
            vrdex-restream-worker:ci

      - name: Run local restream validation
        if: steps.changes.outputs.enabled == 'true'
        run: pnpm proof:restream:local

      - name: Check local restream validation
        if: steps.changes.outputs.enabled == 'true'
        run: pnpm check:restream:local

  build-web:
    name: Build Web
    needs:
      - lint-web
      - verify-docs
      - verify-api-mcp
      - typecheck-web
      - typecheck-backend
      - verify-backend-local
      - restream-local-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build:web

  build-storybook:
    name: Build Storybook
    needs: [lint-web, verify-docs, typecheck-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Storybook build
        run: pnpm build:storybook

  deploy-convex-production:
    name: Deploy Convex Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Convex deploy key
        id: gate
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Convex production deploy"
              echo "Skipped because CONVEX_DEPLOY_KEY_PROD is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex functions and schema
        if: steps.gate.outputs.enabled == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: pnpm exec convex deploy --yes --typecheck=enable

      - name: Run deploy-time migrations
        if: steps.gate.outputs.enabled == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: pnpm exec convex run migrations:runAll --prod

  playwright-data-flow:
    name: Playwright Data Flow
    if: github.event_name == 'pull_request'
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mutation-backed profile submission flow
        id: flow
        env:
          PLAYWRIGHT_RECORD_VIDEO: "true"
          VRDEX_ENABLE_E2E_HELPERS: "true"
          VRDEX_E2E_BROWSER_TOKEN: local-playwright-token
          VRDEX_E2E_CONVEX_SECRET: local-convex-e2e-secret
        run: pnpm --filter web exec playwright test --grep @flow --project=desktop-chromium

      - name: Write data-flow summary
        if: always()
        env:
          FLOW_OUTCOME: ${{ steps.flow.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/data-flow-summary.md <<EOF
          ## Playwright data-flow preview

          Outcome: ${FLOW_OUTCOME}

          Captured flow:
          - test-gated profile submission form
          - gated helper rejection without the Playwright token
          - Convex profile creation
          - submission success state
          - public profile page readback
          - discovery search readback

          Run: ${RUN_URL}
          EOF

      - name: Upload Playwright data-flow artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-data-flow
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-artifacts

  hosted-mcp-preview-smoke:
    name: Hosted MCP Preview Smoke
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: [vercel-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check hosted MCP smoke target
        id: gate
        env:
          CONVEX_PREVIEW_ENABLED: ${{ needs.vercel-preview.outputs.convex-preview-enabled }}
          CONVEX_PREVIEW_URL: ${{ needs.vercel-preview.outputs.convex-preview-url }}
          DEPLOYMENT_URL: ${{ needs.vercel-preview.outputs.deployment-url }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYMENT_URL" ]; then
            {
              echo "## Hosted MCP preview smoke"
              echo "Failed because the Vercel preview deployment URL is unavailable."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$CONVEX_PREVIEW_ENABLED" != "true" ] || [ -z "$CONVEX_PREVIEW_URL" ]; then
            {
              echo "## Hosted MCP preview smoke"
              echo "Failed because a same-branch Convex preview backend is unavailable."
              echo ""
              echo "Set repository secret CONVEX_DEPLOY_KEY_PREVIEW so this required check covers data-backed public reads, Dynamic Client Registration, and Client ID Metadata Document authorization."
              echo "Target was $DEPLOYMENT_URL/mcp."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "mcp_url=$DEPLOYMENT_URL/mcp" >> "$GITHUB_OUTPUT"
          {
            echo "## Hosted MCP preview smoke"
            echo "Running hosted MCP preview smoke with data-backed public reads, Dynamic Client Registration, and Client ID Metadata Document authorization against a same-branch Convex preview backend."
            echo ""
            echo "Target is $DEPLOYMENT_URL/mcp."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hosted MCP smoke
        env:
          VRDEX_MCP_SMOKE_CONTINUE_ON_FAILURE: "true"
          VRDEX_MCP_SMOKE_CIMD: "true"
          VRDEX_MCP_SMOKE_DCR: "true"
          VRDEX_MCP_SMOKE_DATA: "true"
          VRDEX_MCP_SMOKE_URL: ${{ steps.gate.outputs.mcp_url }}
        run: pnpm smoke:mcp-compat

  playwright-hosted-data-flow:
    name: Playwright Hosted Data Flow
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check hosted E2E configuration
        id: gate
        env:
          HOSTED_BASE_URL: ${{ vars.VRDEX_HOSTED_E2E_BASE_URL }}
          HOSTED_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
        run: |
          if [ -z "$HOSTED_BASE_URL" ] || [ -z "$HOSTED_BROWSER_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Playwright hosted data-flow"
              echo "Skipped because VRDEX_HOSTED_E2E_BASE_URL or VRDEX_HOSTED_E2E_BROWSER_TOKEN is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run hosted mutation-backed profile submission flow
        if: steps.gate.outputs.enabled == 'true'
        id: hosted
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.VRDEX_HOSTED_E2E_BASE_URL }}
          PLAYWRIGHT_RECORD_VIDEO: "true"
          PLAYWRIGHT_SKIP_WEBSERVERS: "true"
          VRDEX_ENABLE_E2E_EXTENDED_PROFILE_FLOW: ${{ vars.VRDEX_HOSTED_E2E_EXTENDED_PROFILE_FLOW }}
          VRDEX_ENABLE_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          VRDEX_ENABLE_E2E_ADAPTER_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_ADAPTER_HELPERS }}
          VRDEX_ENABLE_E2E_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          VRDEX_E2E_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:e2e:hosted

      - name: Write hosted data-flow summary
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          HOSTED_OUTCOME: ${{ steps.hosted.outcome }}
          HOSTED_BASE_URL: ${{ vars.VRDEX_HOSTED_E2E_BASE_URL }}
          HOSTED_EXTENDED_PROFILE_FLOW: ${{ vars.VRDEX_HOSTED_E2E_EXTENDED_PROFILE_FLOW }}
          HOSTED_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          HOSTED_ADAPTER_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_ADAPTER_HELPERS }}
          HOSTED_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/hosted-data-flow-summary.md <<EOF
          ## Playwright hosted data-flow

          Outcome: ${HOSTED_OUTCOME}

          Target: ${HOSTED_BASE_URL}

          Hosted extended profile flow: ${HOSTED_EXTENDED_PROFILE_FLOW:-skipped}

          Hosted auth helpers: ${HOSTED_AUTH_HELPERS:-skipped}

          Hosted adapter helpers: ${HOSTED_ADAPTER_HELPERS:-skipped}

          Hosted developer credentials: ${HOSTED_DEVELOPER_CREDENTIALS:-skipped}

          Captured flow:
          - hosted test-gated profile submission form
          - hosted Convex profile creation
          - hosted public profile page readback
          - hosted discovery search readback
          - hosted E2E cleanup

          Run: ${RUN_URL}
          EOF

      - name: Upload hosted data-flow artifacts
        id: upload
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-hosted-data-flow
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-artifacts

  playwright-public-preview:
    name: Playwright Public Preview
    if: github.event_name == 'pull_request'
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture public route screenshots
        id: visual
        run: pnpm test:e2e:visual

      - name: Write visual summary
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/visual-summary.md <<EOF
          ## Playwright public screenshot preview

          Outcome: ${VISUAL_OUTCOME}

          Screenshots: all public route checks passed on desktop and mobile.

          Run: ${RUN_URL}
          EOF

      - name: Upload Playwright artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-public-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-artifacts

  playwright-image-diff:
    name: Playwright Image Diff
    if: github.event_name == 'pull_request'
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare public route screenshots to baselines
        id: snapshots
        run: pnpm test:e2e:snapshots

      - name: Write image-diff summary
        if: always()
        env:
          DIFF_OUTCOME: ${{ steps.snapshots.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/image-diff-summary.md <<EOF
          ## Playwright image diff

          Outcome: ${DIFF_OUTCOME}

          Baselines: committed public route screenshots for desktop and mobile Chromium.

          Run: ${RUN_URL}
          EOF

      - name: Find changed baseline images
        if: always()
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git diff --name-status "refs/remotes/origin/${BASE_REF}" "refs/remotes/origin/pr-head" -- 'apps/web/e2e/__screenshots__/desktop-chromium/*.png' 'apps/web/e2e/__screenshots__/mobile-chromium/*.png' > apps/web/playwright-artifacts/changed-baselines.txt
          cat apps/web/playwright-artifacts/changed-baselines.txt

      - name: Upload Playwright image-diff artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-image-diff
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-artifacts
            apps/web/e2e/__screenshots__

  storybook-component-preview:
    name: Storybook Component Preview
    if: github.event_name == 'pull_request'
    needs: [build-storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture Storybook component screenshots
        id: visual
        run: pnpm test:storybook:visual

      - name: Write Storybook visual summary
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/storybook-visual-summary.md <<EOF
          ## Storybook component screenshot preview

          Outcome: ${VISUAL_OUTCOME}

          Screenshots: component primitive stories captured on desktop and mobile.

          Run: ${RUN_URL}
          EOF

      - name: Upload Storybook visual artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-component-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/playwright-report-storybook
            apps/web/test-results
            apps/web/playwright-artifacts

  storybook-image-diff:
    name: Storybook Image Diff
    if: github.event_name == 'pull_request'
    needs: [build-storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare Storybook component screenshots to baselines
        id: snapshots
        run: pnpm test:storybook:snapshots

      - name: Write Storybook image-diff summary
        if: always()
        env:
          DIFF_OUTCOME: ${{ steps.snapshots.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/web/playwright-artifacts
          cat > apps/web/playwright-artifacts/storybook-image-diff-summary.md <<EOF
          ## Storybook component image diff

          Outcome: ${DIFF_OUTCOME}

          Baselines: committed Storybook primitive screenshots for desktop and mobile Chromium.

          Run: ${RUN_URL}
          EOF

      - name: Find changed Storybook baseline images
        if: always()
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git diff --name-status "refs/remotes/origin/${BASE_REF}" "refs/remotes/origin/pr-head" -- 'apps/web/e2e/__screenshots__/storybook-*/*.png' > apps/web/playwright-artifacts/changed-storybook-baselines.txt
          cat apps/web/playwright-artifacts/changed-storybook-baselines.txt

      - name: Upload Storybook image-diff artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-image-diff
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/playwright-report-storybook
            apps/web/test-results
            apps/web/playwright-artifacts
            apps/web/e2e/__screenshots__/storybook-*

  vercel-preview:
    name: Vercel Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: [playwright-public-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      convex-preview-enabled: ${{ steps.convex-preview-gate.outputs.enabled }}
      convex-preview-url: ${{ steps.convex-preview.outputs.convex_url }}
      deployment-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Vercel deployment secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel preview"
              echo "Deployment skipped because one or more required secrets are missing."
              echo ""
              echo "Required repository secrets:"
              echo "- VERCEL_TOKEN"
              echo "- VERCEL_ORG_ID"
              echo "- VERCEL_PROJECT_ID"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview environment
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@54.4.1 pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Check Convex preview deploy key
        if: steps.gate.outputs.enabled == 'true'
        id: convex-preview-gate
        env:
          CONVEX_DEPLOY_KEY_PREVIEW: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY_PREVIEW" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Convex preview deploy"
              echo "Skipped because CONVEX_DEPLOY_KEY_PREVIEW is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Convex preview functions
        if: steps.gate.outputs.enabled == 'true' && steps.convex-preview-gate.outputs.enabled == 'true'
        id: convex-preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: pnpm exec convex deploy --yes --typecheck=enable --preview-create "$PREVIEW_NAME" --cmd "node scripts/write-convex-preview-output.mjs" --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

      - name: Configure Convex preview runtime and smoke fixture
        if: steps.gate.outputs.enabled == 'true' && steps.convex-preview.outputs.convex_url != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          HOSTED_E2E_AUTH_HELPERS: ${{ vars.VRDEX_HOSTED_E2E_AUTH_HELPERS }}
          HOSTED_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          HOSTED_E2E_DEVELOPER_CREDENTIALS: ${{ vars.VRDEX_HOSTED_E2E_DEVELOPER_CREDENTIALS }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bridge_secret=$(openssl rand -hex 32)
          echo "::add-mask::$bridge_secret"
          echo "VRDEX_PREVIEW_PERSISTENCE_SECRET=$bridge_secret" >> "$GITHUB_ENV"
          printf '%s' preview | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_DEPLOYMENT_ENV
          printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_PREVIEW_PERSISTENCE_BRIDGE
          printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_HOSTED_SMOKE_FIXTURE
          printf '%s' "$bridge_secret" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_PREVIEW_PERSISTENCE_SECRET

          preview_e2e_auth_enabled=false
          if [ "$HOSTED_E2E_AUTH_HELPERS" = "true" ] && [ "$HOSTED_E2E_DEVELOPER_CREDENTIALS" = "true" ] && [ -n "$HOSTED_E2E_BROWSER_TOKEN" ]; then
            e2e_convex_secret=$(openssl rand -hex 32)
            node scripts/generate-convex-auth-preview-keys.mjs
            node scripts/generate-preview-developer-runtime-secrets.mjs
            jwt_private_key=$(<.tmp-gh-artifacts/convex-auth-preview/jwt-private-key)
            jwks=$(<.tmp-gh-artifacts/convex-auth-preview/jwks.json)
            echo "::add-mask::$e2e_convex_secret"
            echo "::add-mask::$jwt_private_key"
            echo "::add-mask::$jwks"
            echo "VRDEX_PREVIEW_E2E_CONVEX_SECRET=$e2e_convex_secret" >> "$GITHUB_ENV"
            printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_HELPERS
            printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_AUTH_HELPERS
            printf '%s' true | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_PREVIEW_OAUTH_TOKEN_BRIDGE
            printf '%s' "$e2e_convex_secret" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_E2E_CONVEX_SECRET
            printf '%s' "$jwt_private_key" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" JWT_PRIVATE_KEY
            printf '%s' "$jwks" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" JWKS
            preview_e2e_auth_enabled=true
          else
            printf '%s' false | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_HELPERS
            printf '%s' false | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_E2E_AUTH_HELPERS
            printf '%s' false | pnpm exec convex env set --preview-name "$PREVIEW_NAME" VRDEX_ENABLE_PREVIEW_OAUTH_TOKEN_BRIDGE
          fi
          echo "VRDEX_PREVIEW_E2E_AUTH_ENABLED=$preview_e2e_auth_enabled" >> "$GITHUB_ENV"

          pnpm exec convex run --preview-name "$PREVIEW_NAME" hostedSmokeFixtures:ensurePublicSearchFixture

      - name: Use Convex preview URL for Vercel build
        if: steps.gate.outputs.enabled == 'true' && steps.convex-preview.outputs.convex_url != ''
        env:
          CONVEX_PREVIEW_URL: ${{ steps.convex-preview.outputs.convex_url }}
        run: |
          echo "NEXT_PUBLIC_CONVEX_URL=$CONVEX_PREVIEW_URL" >> "$GITHUB_ENV"
          echo "CONVEX_URL=$CONVEX_PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Build Vercel preview output
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@54.4.1 build --target=preview --token "$VERCEL_TOKEN"

      - name: Deploy Vercel preview output
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          CONVEX_PREVIEW_URL: ${{ steps.convex-preview.outputs.convex_url }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          VRDEX_E2E_BROWSER_TOKEN: ${{ secrets.VRDEX_HOSTED_E2E_BROWSER_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deploy_args=(deploy --prebuilt --target=preview --token "$VERCEL_TOKEN")
          if [ -n "$CONVEX_PREVIEW_URL" ]; then
            : "${VRDEX_PREVIEW_PERSISTENCE_SECRET:?Preview persistence secret was not configured.}"
            deploy_args+=(
              --env "CONVEX_URL=$CONVEX_PREVIEW_URL"
              --env "VRDEX_DEPLOYMENT_ENV=preview"
              --env "VRDEX_ENABLE_PREVIEW_PERSISTENCE_BRIDGE=true"
              --env "VRDEX_PREVIEW_PERSISTENCE_SECRET=$VRDEX_PREVIEW_PERSISTENCE_SECRET"
            )
          fi
          if [ "${VRDEX_PREVIEW_E2E_AUTH_ENABLED:-false}" = "true" ]; then
            : "${VRDEX_PREVIEW_E2E_CONVEX_SECRET:?Preview E2E Convex secret was not configured.}"
            : "${VRDEX_E2E_BROWSER_TOKEN:?Preview E2E browser token was not configured.}"
            api_token_pepper=$(<.tmp-gh-artifacts/preview-developer-runtime/api-token-pepper)
            oauth_access_token_signing_key=$(<.tmp-gh-artifacts/preview-developer-runtime/oauth-access-token-signing-key)
            oauth_client_secret_pepper=$(<.tmp-gh-artifacts/preview-developer-runtime/oauth-client-secret-pepper)
            oauth_refresh_token_pepper=$(<.tmp-gh-artifacts/preview-developer-runtime/oauth-refresh-token-pepper)
            echo "::add-mask::$api_token_pepper"
            echo "::add-mask::$oauth_access_token_signing_key"
            echo "::add-mask::$oauth_client_secret_pepper"
            echo "::add-mask::$oauth_refresh_token_pepper"
            deploy_args+=(
              --env "VRDEX_ENABLE_E2E_HELPERS=true"
              --env "VRDEX_ENABLE_E2E_AUTH_HELPERS=true"
              --env "VRDEX_E2E_BROWSER_TOKEN=$VRDEX_E2E_BROWSER_TOKEN"
              --env "VRDEX_E2E_CONVEX_SECRET=$VRDEX_PREVIEW_E2E_CONVEX_SECRET"
              --env "VRDEX_API_TOKEN_PEPPER=$api_token_pepper"
              --env "VRDEX_OAUTH_ACCESS_TOKEN_SIGNING_KEY=$oauth_access_token_signing_key"
              --env "VRDEX_OAUTH_ACCESS_TOKEN_SIGNING_KID=vrdex-pr-${{ github.event.pull_request.number }}"
              --env "VRDEX_OAUTH_CLIENT_SECRET_PEPPER=$oauth_client_secret_pepper"
              --env "VRDEX_OAUTH_REFRESH_TOKEN_PEPPER=$oauth_refresh_token_pepper"
            )
          fi
          deployment_url=$(pnpm dlx vercel@54.4.1 "${deploy_args[@]}" | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "Vercel deployment did not return a URL." >&2
            exit 1
          fi
          if [ "${VRDEX_PREVIEW_E2E_AUTH_ENABLED:-false}" = "true" ]; then
            printf '%s' "$deployment_url" | pnpm exec convex env set --preview-name "$PREVIEW_NAME" SITE_URL
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Vercel preview"
            echo "Deployment: $deployment_url"
            echo "Deployment check page: $deployment_url/deployment"
          } >> "$GITHUB_STEP_SUMMARY"

  pr-verification-report:
    name: PR Verification Report
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs:
      - playwright-data-flow
      - playwright-hosted-data-flow
      - playwright-public-preview
      - playwright-image-diff
      - storybook-component-preview
      - storybook-image-diff
      - vercel-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test PR verification report helper
        run: node --test .github/scripts/pr-verification-report.test.cjs

      - name: Update consolidated PR verification report
        uses: actions/github-script@v9
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const { updatePrVerificationReport } = require(
              "./.github/scripts/pr-verification-report.cjs",
            );
            await updatePrVerificationReport({
              core,
              context,
              github,
              needs: JSON.parse(process.env.NEEDS_JSON),
            });
