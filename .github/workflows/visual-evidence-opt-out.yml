name: Visual evidence opt-out

on:
  pull_request_target:
    types: [unlabeled]

permissions:
  contents: read

jobs:
  invalidate-evidence:
    if: (github.event.label.name == 'ci:browsers' || github.event.label.name == 'ci:visuals') && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-verification-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const removed = context.payload.label.name;
            const eventHead = context.payload.pull_request.head.sha;
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            if (current.head.sha !== eventHead || current.labels.some(label => label.name === removed)) return;
            const marker = "<!-- vrdex-pr-verification-report -->";
            const note = "<!-- vrdex-visual-selection-note -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const { data: latest } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            if (latest.head.sha !== eventHead || latest.labels.some(label => label.name === removed)) return;
            const visuals = latest.labels.some(label => label.name === "ci:visuals");
            const browsers = visuals || latest.labels.some(label => label.name === "ci:browsers");
            for (const comment of comments) {
              if (comment.user?.type !== "Bot" || !comment.body?.includes(marker)) continue;
              let snapshot;
              try {
                const match = comment.body.match(/<!-- vrdex-test-selection:(\{.*?\}) -->/);
                snapshot = match && JSON.parse(match[1]);
              } catch { /* Missing or invalid metadata cannot establish current evidence. */ }
              if (snapshot?.head === latest.head.sha && snapshot.browsers === browsers && snapshot.visuals === visuals) continue;
              const historical = comment.body.split(note)[0].trimEnd();
              const body = `${historical}\n\n${note}\nSelection observed at ${new Date().toISOString()} for commit \`${latest.head.sha}\`: Browser coverage selected: ${browsers ? "yes" : "no"}. Visual evidence selected: ${visuals ? "yes" : "no"}. Historical run results above are preserved, including failures. Label edits do not run application CI; request a normal PR run for current selected coverage.`;
              await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
            }
